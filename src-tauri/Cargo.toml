[package]
name = "dinheirovisk"
version = "0.1.0"
license = "MIT"
description = "Dinheirovisky — Seu bolso agradece. Gerenciador financeiro pessoal local."
edition = "2021"
homepage = "https://dinheirovisky.app/"
repository = "https://github.com/DanielLinsAndrade/dinheirovisky"

[lib]
name = "dinheirovisk_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "functions"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri-plugin-dialog = "2"
tempfile = "3"
tauri-plugin-single-instance = "2"
